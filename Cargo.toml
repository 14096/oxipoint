[package]
name = "rsp"
version = "0.0.1-beta5"
edition = "2024"
license = "MIT"
description = "A fluent, type-safe Rust SDK for SharePoint REST and Microsoft Graph"
readme = "README.md"
repository = "https://github.com/14096/rsp"
homepage = "https://github.com/14096/rsp"
documentation = "https://docs.rs/rsp"
keywords = ["sharepoint", "microsoft-graph", "microsoft365", "sdk"]
categories = ["api-bindings", "web-programming::http-client", "authentication"]
exclude = [".env", ".github/", "Makefile"]

[dependencies]
async-trait = "0.1.92"
base64 = "0.23.1"
bytes = "1.12.1"
jsonwebtoken = { version = "11.1.0", optional = true, features = ["aws_lc_rs", "use_pem"] }
open = { version = "5.4.5", optional = true }
p12-keystore = { version = "0.4.1", optional = true }
percent-encoding = "2.3.2"
rand = "0.10.3"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls", "form", "query"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt", "rt-multi-thread", "macros", "time", "net", "io-util", "sync"] }
url = "2.5.8"

[features]
default = ["graph", "sharepoint", "auth-password", "auth-certificate", "auth-browser", "auth-device-code"]
graph = []
sharepoint = []
auth-password = []
auth-device-code = []
auth-certificate = ["dep:jsonwebtoken", "dep:p12-keystore"]
auth-browser = ["dep:open"]

[dev-dependencies]
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "fs"] }
wiremock = "0.6.5"
